<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WCD Quiz Generator</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/output.css" />

    <script src="js/random-lib.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/quiz-log.js"></script>
    <script src="js/quiz-capacity.js"></script>
    <script src="js/quiz-selection.js"></script>
    <script src="js/create-quizzes.js"></script>
    <script src="js/create-gui.js"></script>
    <script src="js/quiz-errors-ui.js"></script>
    <script src="js/output-quizzes.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <h1 class="no-print">WCD Quiz Generator - JOHN - 2026/27</h1>

    <main>
      <!-- Chapter & Question Type Selection Section -->
      <section class="material-grid no-print">
        <!-- Chapter Selection Div -->
        <div class="panel" id="chapter-grid"></div>
        <!-- Question Types & Quiz Settings Div -->
        <div class="panel">
          <h2>Question Types</h2>
          <div id="qtype-div"></div>
          <div class="div-btns">
            <button id="sr-a-btn">Senior A</button>
            <button id="rk-a-btn">Rookie A</button>
            <button id="b-div-btn">B Division</button>
          </div>
          <div class="settings">
            <h2>Quiz Settings</h2>
            <p>
              <input type="text" id="quiz-title" placeholder="Title of Quiz" />
            </p>
            <p>
              Number of Quizzes:
              <input id="num-quizzes" type="number" value="1" />
              Max "W" Questions:
              <input id="max-w" type="number" value="3" />
            </p>
            <p>
              <label>
                <input type="checkbox" id="allow-dupe" /> Allow Duplicate Verses
                in a Quiz
              </label>
            </p>

            <p>
              <label>
                <input type="radio" name="ques-use" id="reset-ques" /> Reset
                Used Questions each Quiz
              </label>
            </p>
            <p>
              <label>
                <input
                  type="radio"
                  name="ques-use"
                  id="max-use-radio"
                  checked
                />
                Max Times a Question may be used:
                <input type="number" id="max-use" value="1" />
              </label>
            </p>
            <p>
              <label>
                <input type="checkbox" id="include-ab" checked /> Include A & B
                Questions
              </label>
            </p>
            <p class="settings-checkbox-row">
              <label>
                <input type="checkbox" id="strict-mode" checked /> Strict Mode
              </label>
              <span class="tooltip-wrap">
                <span class="tooltip-icon" aria-hidden="true">?</span>
                <span class="tooltip-text"
                  >Checked: Min and Max per question type are required.
                  Unchecked: Min and Max are preferred but ignored when your
                  range cannot satisfy them.</span
                >
              </span>
            </p>
            <!-- <p>
              <label>
                <input type="checkbox" id="extra-ques" /> Create Extra Questions
                for Quiz Meet
              </label>
            </p>
            <p>
              <label>
                <input type="checkbox" id="final-quiz" /> Create Additional
                Final Quiz
              </label>
            </p> -->
            <p>
              <button id="create-qz-btn">CREATE QUIZ(ZES)</button>
            </p>
          </div>
          <div>
            <p id="feedback"></p>
          </div>
        </div>
      </section>

      <!-- Created Quizzes Output Section -->
      <section id="quiz-output" class="print-only"></section>
    </main>
  </body>
</html>
